<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CarScore — first-car buying copilot for Canada. Live listings, scored for reliability, value, winter driving and ownership cost." />
    <title>CarScore</title>
    <script>
      // Apply saved theme before first paint to avoid a flash.
      try {
        if (localStorage.getItem("carscore:v2:theme") === "light") {
          document.documentElement.classList.remove("dark");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
