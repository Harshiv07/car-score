<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CarScore: first-car buying copilot for Canada. Live listings, scored for reliability, value, winter driving and ownership cost." />
    <title>CarScore</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://carscores.vercel.app/" />
    <meta property="og:url" content="https://carscores.vercel.app/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CarScore" />
    <meta property="og:title" content="CarScore: which used car should you look at first?" />
    <meta property="og:description" content="Used cars in Canada, scored out of 100 on reliability, real market value, winter capability and running cost." />
    <meta name="twitter:card" content="summary" />
    <meta name="theme-color" content="#eef2f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e151c" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply the theme before first paint to avoid a flash: a saved choice
      // wins, otherwise follow the system.
      try {
        var t = localStorage.getItem("carscore:v2:theme");
        var dark = t ? t === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
