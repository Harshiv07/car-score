<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CarScore: first-car buying copilot for Canada. Live listings, scored for reliability, value, winter driving and ownership cost." />
    <title>CarScore</title>
    <meta name="theme-color" content="#eef2f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e151c" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply the theme before first paint to avoid a flash: a saved choice
      // wins, otherwise follow the system.
      try {
        var t = localStorage.getItem("carscore:v2:theme");
        var dark = t ? t === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
