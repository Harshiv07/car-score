# Render Blueprint — deploys the CarScore API as a persistent Node web service.
# In the Render dashboard: New > Blueprint > point at this repo > it reads this file.
# After creation, set MONGODB_URI in the service's Environment tab (get a free
# cluster at https://www.mongodb.com/cloud/atlas — copy its connection string).
services:
  - type: web
    name: carscore-api
    runtime: node
    plan: free
    rootDir: .
    # No Chromium here on purpose: the primary source (Clutch.ca) is a
    # browser-free JSON API, and Playwright's Chromium rarely launches on
    # Render's free plan (missing system libs) — installing it just slows and
    # flakes the build. To enable the browser fallback for the JS dealer sites,
    # add `&& npx playwright install --with-deps chromium` and set
    # SCRAPE_JS_FALLBACK=1 below.
    buildCommand: npm install && npm run build -w server
    startCommand: npm run start -w server
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: MONGODB_URI
        sync: false
