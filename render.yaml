# Render Blueprint — deploys the CarScore API as a persistent Node web service.
# In the Render dashboard: New > Blueprint > point at this repo > it reads this file.
# After creation, set MONGODB_URI in the service's Environment tab (get a free
# cluster at https://www.mongodb.com/cloud/atlas — copy its connection string).
#
# Docker runtime (not Render's native Node runtime): the native runtime's
# build sandbox has no apt/root access, so `playwright install --with-deps`
# could download the Chromium binary but not its shared-library dependencies
# — the browser was on disk but failed to *launch* at runtime, confirmed live
# in production ("Chromium is not installed (or can't launch)"). A Docker
# build runs as root, so the same install genuinely works — see ./Dockerfile.
#
# IMPORTANT — applying this change: Render generally does not convert an
# existing service's runtime in place. In the dashboard, either delete the
# existing "carscore-api" service and re-run this Blueprint (a same-named
# service should get the same *.onrender.com URL, but re-confirm it after),
# or check whether Render's Blueprint sync now supports in-place runtime
# changes. Either way, MONGODB_URI (sync: false, deliberately not stored in
# this file) will need to be re-entered if the service is recreated.
services:
  - type: web
    name: carscore-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: MONGODB_URI
        sync: false
