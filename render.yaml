# Render Blueprint — deploys the CarScore API as a persistent Node web service.
# In the Render dashboard: New > Blueprint > point at this repo > it reads this file.
# After creation, set MONGODB_URI in the service's Environment tab (get a free
# cluster at https://www.mongodb.com/cloud/atlas — copy its connection string).
services:
  - type: web
    name: carscore-api
    runtime: node
    plan: free
    rootDir: .
    # --with-deps installs Chromium's shared-library dependencies (libnss3,
    # libatk, libgbm, ...) too, not just the browser binary — a plain
    # `playwright install chromium` downloads the binary but Render's minimal
    # base image is missing those libs, so it fails to LAUNCH at runtime
    # (looks like "not installed" in the logs even though the download
    # succeeded at build time). Wrapped in `|| true` so a flaky/impossible
    # install (no apt/root in this build environment) never breaks the whole
    # deploy — the scrape/render-fallback code already no-ops gracefully when
    # no browser is available, same as before this was added.
    buildCommand: npm install && (npx playwright install --with-deps chromium || true) && npm run build -w server
    startCommand: npm run start -w server
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: MONGODB_URI
        sync: false
      # Installs Chromium inside node_modules/ instead of the default
      # per-user cache dir (~/.cache/ms-playwright) — the project directory
      # is what actually carries over from the build step to the running
      # service on Render; a cache dir outside it may not persist, which is
      # the single most common reason "playwright install" succeeds at build
      # time but the browser is reported missing at runtime.
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
